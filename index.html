<!doctype html>

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  /* Layout: darkroom bench. A sticky print stage on top (left column when wide), adjustment drawers below, a fixed action rail at the bottom. */
  --bg:#E8EBEE;
  --surface:#FFFFFF;
  --surface-2:#EEF1F4;
  --fg:#15181C;
  --muted:#59616B;
  --line:#D2D7DD;
  --accent:#9A5800;
  --accent-fg:#FFFFFF;
  --accent-soft:rgba(154,88,0,.12);
  --stage:#D5DAE0;
  --stage-fg:#3B424A;
  --scrim:rgba(12,14,17,.55);
  --shadow:rgba(10,12,16,.22);
  --knob:#FFFFFF;
  --danger:#B42318;
  --bar:rgba(232,235,238,.88);
  --font-ui:-apple-system,system-ui,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114;--surface:#171A1E;--surface-2:#1F2328;--fg:#ECEEF0;--muted:#98A0AA;--line:#2A2F35;
    --accent:#F0A63A;--accent-fg:#1C1404;--accent-soft:rgba(240,166,58,.15);
    --stage:#07080A;--stage-fg:#B8BEC6;--scrim:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.55);--knob:#FFFFFF;--danger:#FF7A6E;--bar:rgba(15,17,20,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114;--surface:#171A1E;--surface-2:#1F2328;--fg:#ECEEF0;--muted:#98A0AA;--line:#2A2F35;
  --accent:#F0A63A;--accent-fg:#1C1404;--accent-soft:rgba(240,166,58,.15);
  --stage:#07080A;--stage-fg:#B8BEC6;--scrim:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.55);--knob:#FFFFFF;--danger:#FF7A6E;--bar:rgba(15,17,20,.88);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-ui);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stage)}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "strip" "panel"}
.top{grid-area:top;display:flex;align-items:flex-end;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;min-width:0}
.top h1{margin:0;font-size:1.3rem;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.readout{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-width:0}

.stage{grid-area:stage;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--stage);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.stage-inner{position:relative;height:min(46vh,540px);display:flex;align-items:center;justify-content:center;padding:14px}
#preview{display:block;max-width:100%;max-height:100%;box-shadow:0 2px 6px var(--shadow),0 14px 36px var(--shadow)}
.badge{position:absolute;left:12px;top:12px;font-size:.74rem;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.busy{position:absolute;left:0;right:0;bottom:12px;margin:0 auto;width:max-content;max-width:90%;font-size:.8rem;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--fg);border:1px solid var(--line);font-variant-numeric:tabular-nums}

.strip{grid-area:strip;display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;min-width:0}
.strip::-webkit-scrollbar{display:none}

.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb.add{display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--muted);font-size:1.5rem;line-height:1;background:none}

.panel{grid-area:panel;display:grid;gap:12px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 2px;border-radius:9px;font-size:.92rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.tabpanel{display:grid;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.card-h h2{margin:0;font-size:.95rem;font-weight:650;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.card-body{display:grid;gap:12px;min-width:0}
.row{display:grid;grid-template-columns:6.4em minmax(0,1fr) 4.4em;align-items:center;gap:10px;min-width:0}
.row.wide{grid-template-columns:6.4em minmax(0,1fr)}
.row.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>label:first-child,.lbl{font-size:.88rem;color:var(--muted)}
.val{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.textrow{display:grid;gap:8px;min-width:0}
input[type=range]{width:100%;min-width:0;margin:0;accent-color:var(--accent);height:28px;background:transparent}
input[type=text],select{width:100%;min-width:0;font-size:16px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
input[type=text]{-webkit-appearance:none;appearance:none}
input[type=color]{width:46px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:2px;cursor:pointer}
.switch{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:0 0 auto;margin:0;transition:background-color .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px var(--shadow);transition:transform .15s}
.switch:checked{background:var(--accent);border-color:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);width:max-content;max-width:100%}
.seg label{padding:6px 12px;border-radius:8px;font-size:.88rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg input:checked+label{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.seg input:focus-visible+label,.grid9 input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:.8rem;padding:4px 10px;border-radius:999px;cursor:pointer}
.chip::before{content:"+ ";color:var(--accent)}
.grid9{display:grid;grid-template-columns:repeat(3,40px);gap:4px}
.grid9 label{height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.grid9 label::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.grid9 input:checked+label{background:var(--accent-soft);border-color:var(--accent)}
.grid9 input:checked+label::after{background:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
.field.span2{grid-column:1/-1}
.hint{margin:0;font-size:.82rem;color:var(--muted);line-height:1.6}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:16px;line-height:1.1;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:center}
.btn.small{font-size:.86rem;padding:8px 12px;border-radius:9px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--danger);border-color:currentColor}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:.84rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.alias{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
.alias:empty{display:none}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bar);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.actions .btn{flex:1 1 0;max-width:280px}
.actions .btn.pick-more{flex:0 0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;width:max-content;max-width:min(92vw,520px);padding:10px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:.9rem;box-shadow:0 6px 20px var(--shadow)}

.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{margin:0;font-size:1.05rem}
.result{display:grid;gap:8px;justify-items:center;background:var(--stage);border-radius:12px;padding:12px;min-height:180px;align-content:center}
.result img{display:block;max-width:100%;max-height:52vh;width:auto;height:auto;-webkit-touch-callout:default}
.result-meta{font-family:var(--font-mono);font-size:.76rem;color:var(--stage-fg);font-variant-numeric:tabular-nums;text-align:center;overflow-wrap:anywhere}
.res-strip{display:flex;gap:8px;overflow-x:auto;padding:2px}
.res-strip button{flex:0 0 auto;width:52px;height:52px;border-radius:9px;border:2px solid transparent;padding:0;background:var(--surface-2) center/cover no-repeat;position:relative;cursor:pointer}

.res-strip button.saved::after{content:"已存";position:absolute;left:2px;right:2px;bottom:2px;font-size:.62rem;line-height:1.4;border-radius:5px;background:var(--accent);color:var(--accent-fg)}

@media (min-width:920px){
  .app{grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);grid-template-areas:"top top" "stage strip" "stage panel";align-items:start}
  .stage{margin:0;border-radius:18px;overflow:hidden;top:calc(env(safe-area-inset-top,0px) + 14px)}
  .stage-inner{height:min(80vh,920px)}
  .actions{justify-content:flex-end}
  .sheet{align-items:center}
  .sheet-card{border-radius:18px;max-height:90%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<div class="app">
  <header class="top">
    <div>
      <h1>照片參數邊框</h1>
      <p>模糊背景、機型與拍攝參數，文字、Logo、浮水印都能調。</p>
    </div>
    <div class="readout" id="readout" aria-live="polite"></div>
  </header>

  <section class="stage" aria-label="預覽">
    <div class="stage-inner" id="stageInner">
      <canvas id="preview" role="img" aria-label="邊框預覽" width="10" height="10"></canvas>
      <span class="badge" id="sampleBadge">範例照片</span>
      <div class="busy" id="busy" hidden><span id="busyText">讀取中</span></div>
    </div>
  </section>

  <div class="strip" id="strip" role="group" aria-label="已選的照片"></div>

  <main class="panel">
    <div class="tabs" role="tablist" aria-label="調整項目">
      <button class="tab" role="tab" type="button" id="tab-photo" aria-controls="panel-photo" aria-selected="false">照片</button>
      <button class="tab" role="tab" type="button" id="tab-text" aria-controls="panel-text" aria-selected="false">文字</button>
      <button class="tab" role="tab" type="button" id="tab-wm" aria-controls="panel-wm" aria-selected="false">浮水印</button>
      <button class="tab" role="tab" type="button" id="tab-layout" aria-controls="panel-layout" aria-selected="false">版面</button>
      <button class="tab" role="tab" type="button" id="tab-out" aria-controls="panel-out" aria-selected="false">輸出</button>
    </div>
    <section class="tabpanel" role="tabpanel" id="panel-photo" aria-labelledby="tab-photo" hidden></section>
    <section class="tabpanel" role="tabpanel" id="panel-text" aria-labelledby="tab-text" hidden></section>
    <section class="tabpanel" role="tabpanel" id="panel-wm" aria-labelledby="tab-wm" hidden></section>
    <section class="tabpanel" role="tabpanel" id="panel-layout" aria-labelledby="tab-layout" hidden></section>
    <section class="tabpanel" role="tabpanel" id="panel-out" aria-labelledby="tab-out" hidden></section>
  </main>
</div>

<div class="actions">
  <button class="btn primary" id="btnPick" type="button">選擇照片</button>
  <button class="btn primary" id="btnSave" type="button" hidden>輸出這張</button>
  <button class="btn" id="btnAll" type="button" hidden>全部輸出</button>
</div>
<input type="file" id="fileInput" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <div class="sheet-h"><h2 id="sheetTitle">輸出完成</h2><button class="btn small" id="sheetClose" type="button">關閉</button></div>
    <div class="result"><img id="resImg" alt=""><div class="result-meta" id="resMeta"></div></div>
    <div class="res-strip" id="resStrip" hidden></div>
    <div class="btnrow"><button class="btn primary" id="resSave" type="button">存到相簿</button><button class="btn" id="resSaveAll" type="button" hidden>全部存到相簿</button></div>
    <p class="hint" id="resHint"></p>
    <p class="hint" id="resProgress" aria-live="polite"></p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/exifr.full.umd.js"></script>
<script src="vendor/stackblur.min.js"></script>

    ['tl', 'tc', 'tr', 'ml', 'mc', 'mr', 'bl', 'bc', 'br'].forEach(function (v) {
      var id = name + '-' + v;
      var r = el('input', { type: 'radio', name: name, id: id, value: v, class: 'vh' });
      r.checked = S.wm.pos === v;
      r.addEventListener('change', function () { if (r.checked) { S.wm.pos = v; changed('wm.pos'); } });
      grid.append(r, el('label', { for: id, title: names[v], 'aria-label': names[v] }));
    });
    return el('div', { class: 'row wide' }, el('span', { class: 'lbl', id: name + '-l', text: '位置' }), grid);
  }
  function buildWmPanel() {
    var panel = $('#panel-wm');
    function isText() { return S.wm.type === 'text'; }
    var fb = fileButton('wmFile', wmImg ? '換圖片' : '上傳圖片', function (f) { loadUserImage(f, 'wm'); });
    var imgRow = el('div', { class: 'row wide' }, el('span', { class: 'lbl', text: '圖片' }),
      el('div', { class: 'btnrow' }, fb[0], wmImg ? el('button', { type: 'button', class: 'btn small', onclick: function () { clearUserImage('wm'); } }, '移除') : null, fb[1]));
    panel.replaceChildren(card('浮水印', [
      segRow('wm.type', '類型', [['text', '文字'], ['image', '圖片']]),
      showIf(textRow('wm.tpl', '內容'), isText),
      showIf(selectRow('wm.font', '字體', FONT_OPTS), isText),
      showIf(selectRow('wm.weight', '粗細', WEIGHTS, true), isText),
      showIf(rangeRow('wm.size', '大小', 0.5, 10, 0.05, pct), isText),
      showIf(colorRow('wm.color', '顏色'), isText),
      showIf(imgRow, function () { return !isText(); }),
      showIf(rangeRow('wm.imgH', '圖片高度', 1, 30, 0.1, pct), function () { return !isText() && !!wmImg; }),
      rangeRow('wm.opacity', '不透明度', 5, 100, 1, function (v) { return v + '%'; }),
      segRow('wm.scope', '範圍', [['photo', '照片上'], ['canvas', '整張圖']]),
      showIf(posRow(), function () { return !S.wm.tile; }),
      showIf(rangeRow('wm.margin', '邊距', 0, 20, 0.1, pct), function () { return !S.wm.tile; }),
      rangeRow('wm.rotate', '旋轉', -90, 90, 1, function (v) { return v + '°'; }),
      switchRow('wm.tile', '平鋪整面（防盜用）'),
      showIf(rangeRow('wm.tileGap', '平鋪間距', 2, 40, 0.5, pct), function () { return !!S.wm.tile; }),
      showIf(el('p', { class: 'hint', text: '圖片浮水印建議用去背 PNG，例如簽名或個人標誌。' }), function () { return !isText(); })
    ], 'wm.on'));
  }
  function buildLayoutPanel() {
    var panel = $('#panel-layout');
    function blur() { return S.bg === 'blur'; }
    panel.replaceChildren(
      card('畫面', [
        selectRow('ratio', '比例', RATIOS),
        rangeRow('side', '左右留白', 0, 15, 0.1, pct),
        rangeRow('top', '上方留白', 0, 15, 0.1, pct),
        rangeRow('bottom', '文字區高度', 0, 45, 0.1, pct)
      ]),
      card('照片', [
        rangeRow('radius', '圓角', 0, 6, 0.05, pct),
        rangeRow('shadow', '陰影', 0, 100, 1, function (v) { return String(v); })
      ]),
      card('背景', [
        segRow('bg', '背景', [['blur', '模糊照片'], ['solid', '純色']]),
        showIf(rangeRow('blur', '模糊程度', 0, 100, 1, function (v) { return String(v); }), blur),
        showIf(rangeRow('zoom', '放大', 1, 2.5, 0.01, function (v) { return v.toFixed(2) + '×'; }), blur),
        showIf(rangeRow('tone', '亮暗', -60, 80, 1, function (v) { return v > 0 ? '暗 ' + v : v < 0 ? '亮 ' + (-v) : '0'; }), blur),
        showIf(colorRow('bgColor', '顏色'), function () { return S.bg === 'solid'; }),
        showIf(el('p', { class: 'hint', text: '純色背景如果選淺色，記得到「文字」把文字顏色改深。' }), function () { return S.bg === 'solid'; })
      ])
    );
  }
  function buildOutPanel() {
    var panel = $('#panel-out');
    var rows = [
      segRow('out.long', '長邊', [[2048, '2048'], [3072, '3072'], [4096, '4096']], true),
      segRow('out.format', '格式', [['jpg', 'JPG'], ['png', 'PNG']]),
      showIf(rangeRow('out.quality', 'JPG 品質', 70, 100, 1, function (v) { return String(v); }), function () { return S.out.format === 'jpg'; })
    ];
    if (P3_OK) rows.push(segRow('out.space', '色彩', [['auto', '自動'], ['p3', 'Display P3'], ['srgb', 'sRGB']]));
    rows.push(el('p', { class: 'hint', id: 'outSize' }));
    var reset = el('button', { type: 'button', class: 'btn small' }, '重設所有設定');
    var armed = 0;
    reset.addEventListener('click', function () {
      if (!armed) {
        reset.textContent = '再按一次確認重設';
        reset.classList.add('danger');
        armed = setTimeout(function () { armed = 0; reset.textContent = '重設所有設定'; reset.classList.remove('danger'); }, 4000);
        return;
      }
      clearTimeout(armed); armed = 0;
      var aliases = S.aliases;
      S = clone(DEFAULTS);
      S.aliases = aliases;
      saveSoon(); rebuildPanels(); requestRender(); updateReadout();
      toast('已重設成預設值');
    });
    panel.replaceChildren(
      card('輸出', rows),
      card('設定', [
        el('p', { class: 'hint', text: '調整會自動記在這支手機的這個 App 裡，下次打開還在；上傳的 Logo 和浮水印圖片也會記住。自動色彩在 iPhone 上會保留 P3 廣色域。照片只在手機上處理，不會上傳到任何地方。' }),
        el('div', { class: 'btnrow' }, reset)
      ])
    );
    updateSizeHint();
  }
  function rebuildPanels() {
    buildPhotoPanel(); buildTextPanel(); buildWmPanel(); buildLayoutPanel(); buildOutPanel();
    refreshVisibility();
  }
  function updateSizeHint() {
    var e = document.getElementById('outSize');
    var p = currentPhoto();
    if (!e || !p) return;
    var O = outSize(layout(p.w, p.h, S), S.out.long);
    e.textContent = '這張輸出約 ' + O.w + ' × ' + O.h + ' 像素' + (O.capped ? '（已依瀏覽器上限自動縮小）' : '') + '。';
  }

  /* ---------- chrome ---------- */
  var TABS = ['photo', 'text', 'wm', 'layout', 'out'];
  function selectTab(name) {
    if (TABS.indexOf(name) < 0) name = 'text';
    TABS.forEach(function (t) {
      var on = t === name;
      var tab = document.getElementById('tab-' + t);
      tab.setAttribute('aria-selected', String(on));
      tab.tabIndex = on ? 0 : -1;
      document.getElementById('panel-' + t).hidden = !on;
    });
    lsSet(LS.tab, name);
    if (name === 'out') updateSizeHint();
  }
  function renderStrip() {
    var strip = $('#strip');
    var kids = photos.map(function (p, i) {
      var b = el('button', { type: 'button', class: 'thumb', 'aria-label': p.sample ? '範例照片' : '第 ' + (i + 1) + ' 張', 'aria-current': String(p.id === currentId) });
      b.style.backgroundImage = 'url("' + p.thumb + '")';
      b.addEventListener('click', function () { if (p.id !== currentId) setCurrent(p.id); });
      return b;
    });
    kids.push(el('button', { type: 'button', class: 'thumb add', 'aria-label': '加入照片', onclick: pickFiles }, '+'));
    strip.replaceChildren.apply(strip, kids);
  }
  function updateReadout() {
    var p = currentPhoto();
    var r = $('#readout');
    if (!p) { r.textContent = ''; return; }
    var v = valsFor(p);
    r.textContent = [v.model, v.f, v.iso, v.ss, v.fl].filter(Boolean).join('  ·  ') || '沒有拍攝參數';
  }
  function updateActions() {
    var real = photos.filter(function (p) { return !p.sample; });
    var pick = $('#btnPick');
    pick.textContent = real.length ? '+ 照片' : '選擇照片';
    pick.classList.toggle('primary', !real.length);
    pick.classList.toggle('pick-more', !!real.length);
    $('#btnSave').hidden = !real.length;
    var all = $('#btnAll');
    all.hidden = real.length < 2;
    all.textContent = '全部 ' + real.length + ' 張';
    var cp = currentPhoto();
    $('#sampleBadge').hidden = !(cp && cp.sample);
  }
  var toastTimer = 0;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function showBusy(msg) { $('#busyText').textContent = msg; $('#busy').hidden = false; }
  function hideBusy() { $('#busy').hidden = true; }
  function pickFiles() { $('#fileInput').click(); }

  /* ---------- export sheet ---------- */
  var results = [], resIdx = 0, sheetOpen = false, exporting = false;
  function openSheet(n) {
    results.forEach(function (r) { URL.revokeObjectURL(r.url); });
    results = []; resIdx = 0; sheetOpen = true;
    $('#resImg').removeAttribute('src');
    $('#resMeta').textContent = '';
    $('#resStrip').replaceChildren();
    $('#resStrip').hidden = n < 2;
    $('#sheetTitle').textContent = n > 1 ? '輸出 ' + n + ' 張' : '輸出這張';
    $('#sheet').hidden = false;
    document.body.classList.add('noscroll');
    refreshSheetButtons();
    $('#sheetClose').focus();
  }
  function closeSheet() {
    sheetOpen = false;
    $('#sheet').hidden = true;
    document.body.classList.remove('noscroll');
    $('#resImg').removeAttribute('src');
    results.forEach(function (r) { URL.revokeObjectURL(r.url); });
    results = [];
    $('#resStrip').replaceChildren();
    $('#resProgress').textContent = '';
  }
  function showResult(i) {
    var r = results[i];
    if (!r) return;
    resIdx = i;
    var img = $('#resImg');
    img.src = r.url;
    img.alt = r.name;
    $('#resMeta').textContent = r.name + '  ·  ' + r.size.w + '×' + r.size.h + '  ·  ' + (r.blob.size / 1048576).toFixed(1) + ' MB';
    $$('#resStrip button').forEach(function (b, j) { b.setAttribute('aria-current', String(j === i)); });
    refreshSheetButtons();
  }
  var CAN_SHARE = (function () {
    try {
      if (!navigator.share || !navigator.canShare || typeof File !== 'function') return false;
      return navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/jpeg' })], 'x.jpg', { type: 'image/jpeg' })] });
    } catch (e) { return false; }
  })();
  function refreshSheetButtons() {
    var save = $('#resSave'), all = $('#resSaveAll');
    var r = results[resIdx];
    save.hidden = false;
    all.hidden = results.length < 2;
    save.disabled = !r;
    all.disabled = !results.length || exporting;
    save.textContent = CAN_SHARE ? (r && r.saved ? '再存一次' : '存到相簿') : '下載這張';
    all.textContent = CAN_SHARE ? '全部存到相簿（' + results.length + ' 張）' : '全部下載';
    $('#resHint').textContent = CAN_SHARE
      ? '按「存到相簿」後選「儲存影像」就會進照片，多張可以一次全部存。也可以長按圖片 →「加入照片」。'
      : '這個瀏覽器不能直接分享，按「下載」存檔，或在圖片上按右鍵另存。';
    $$('#resStrip button').forEach(function (b, j) { b.classList.toggle('saved', !!(results[j] && results[j].saved)); });
  }
  function shareResults(list) {
    var files = list.map(function (r) { return new File([r.blob], r.name, { type: r.blob.type || 'image/jpeg' }); });
    if (!CAN_SHARE || (navigator.canShare && !navigator.canShare({ files: files }))) return Promise.resolve('unavailable');
    return navigator.share({ files: files }).then(function () { return 'saved'; }, function (e) { return e && e.name === 'AbortError' ? 'declined' : 'error'; });
  }
  function downloadResult(r) {
    var a = document.createElement('a');
    a.href = r.url; a.download = r.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function exportList(list) {
    if (!list.length || exporting) return;
    exporting = true;
    openSheet(list.length);
    var chain = Promise.resolve();
    list.forEach(function (p, i) {
      chain = chain.then(function () {
        if (!sheetOpen) return;
        $('#resProgress').textContent = '輸出中 ' + (i + 1) + ' / ' + list.length + '…';
        return nextFrame().then(nextFrame).then(function () { return exportPhoto(p); }).then(function (r) {
          if (!sheetOpen) return;
          r.url = URL.createObjectURL(r.blob);
          results.push(r);
          var idx = results.length - 1;
          var b = el('button', { type: 'button', 'aria-label': '第 ' + (idx + 1) + ' 張成品' });
          b.style.backgroundImage = 'url("' + r.thumb + '")';
          b.addEventListener('click', function () { showResult(idx); });
          $('#resStrip').append(b);
          if (idx === 0) showResult(0); else refreshSheetButtons();
        }).catch(function (e) {
          console.error(e);
          toast((p.name || '照片') + ' 輸出失敗，可以到「輸出」把長邊調小再試');
        });
      });
    });
    chain.then(function () {
      exporting = false;
      if (!sheetOpen) return;
      $('#resProgress').textContent = results.length > 1 ? '完成，共 ' + results.length + ' 張。' : '';
      refreshSheetButtons();
    });
  }

  /* ---------- wiring ---------- */
  function initDownloads() { /* standalone build: saving goes through the share sheet */ }
  function wire() {
    TABS.forEach(function (t, i) {
      var tab = document.getElementById('tab-' + t);
      tab.addEventListener('click', function () { selectTab(t); });
      tab.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        var n = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
        selectTab(n);
        document.getElementById('tab-' + n).focus();
      });
    });
    $('#btnPick').addEventListener('click', pickFiles);
    $('#fileInput').addEventListener('change', function () {
      var input = $('#fileInput');
      var files = Array.prototype.slice.call(input.files || []);
      input.value = '';
      addFiles(files);
    });
    $('#btnSave').addEventListener('click', function () { var p = currentPhoto(); if (p && !p.sample) exportList([p]); });
    $('#btnAll').addEventListener('click', function () { exportList(photos.filter(function (p) { return !p.sample; })); });
    $('#sheetClose').addEventListener('click', closeSheet);
    $('#sheet').addEventListener('click', function (e) { if (e.target === e.currentTarget) closeSheet(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetOpen) closeSheet(); });
    $('#resSave').addEventListener('click', function () {
      var r = results[resIdx];
      if (!r) return;
      if (!CAN_SHARE) { downloadResult(r); r.saved = true; refreshSheetButtons(); return; }
      shareResults([r]).then(function (st) {
        if (st === 'saved') r.saved = true;
        else if (st === 'error' || st === 'unavailable') toast('分享沒有成功，可以改用長按圖片 →「加入照片」');
        refreshSheetButtons();
      });
    });
    $('#resSaveAll').addEventListener('click', function () {
      if (!results.length) return;
      if (!CAN_SHARE) { results.forEach(function (r) { downloadResult(r); r.saved = true; }); refreshSheetButtons(); return; }
      shareResults(results).then(function (st) {
        if (st === 'saved') results.forEach(function (r) { r.saved = true; });
        else if (st === 'error' || st === 'unavailable') toast('一次分享太多張沒有成功，可以點縮圖一張一張存');
        refreshSheetButtons();
      });
    });
    window.addEventListener('resize', requestRender);
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', requestRender);
  }
  function init() {
    previewCanvas = $('#preview');
    stageInner = $('#stageInner');
    addSample();
    wire();
    rebuildPanels();
    renderStrip();
    updateActions();
    updateReadout();
    selectTab(lsGet(LS.tab) || 'text');
    requestRender();
    loadStoredImages().then(function () { rebuildPanels(); requestRender(); });
    initDownloads();
  }
  init();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
